<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pamasko_Randomizer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 50%, #7e22ce 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow: hidden;
        }

        .snowflake {
            position: fixed;
            top: -10px;
            z-index: 1;
            color: white;
            font-size: 1em;
            opacity: 0.8;
            animation: fall linear infinite;
        }

        @keyframes fall {
            to {
                transform: translateY(100vh);
            }
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 30px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 500px;
            width: 100%;
            position: relative;
            z-index: 10;
        }

        h1 {
            color: #c41e3a;
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }

        .subtitle {
            color: #165e3f;
            font-size: 1.2em;
            margin-bottom: 20px;
        }

        .prize-list {
            background: rgba(196, 30, 58, 0.1);
            border: 2px solid #c41e3a;
            border-radius: 15px;
            padding: 15px;
            margin-bottom: 20px;
        }

        .prize-list-title {
            color: #c41e3a;
            font-weight: bold;
            font-size: 1.1em;
            margin-bottom: 10px;
        }

        .prize-items {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }

        .prize-item {
            background: linear-gradient(135deg, #ffd700 0%, #ffed4e 100%);
            color: #c41e3a;
            padding: 8px 15px;
            border-radius: 20px;
            font-weight: bold;
            border: 2px solid #c41e3a;
            font-size: 0.95em;
        }

        .result-box {
            background: linear-gradient(135deg, #ffd700 0%, #ffed4e 100%);
            border: 4px solid #c41e3a;
            border-radius: 20px;
            padding: 40px 20px;
            margin: 30px 0;
            min-height: 150px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: transform 0.3s ease;
        }

        .result-box.spinning {
            animation: spin 0.5s ease-in-out;
        }

        @keyframes spin {
            0%, 100% { transform: rotate(0deg) scale(1); }
            25% { transform: rotate(-5deg) scale(1.05); }
            75% { transform: rotate(5deg) scale(1.05); }
        }

        .amount {
            font-size: 3.5em;
            font-weight: bold;
            color: #c41e3a;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
            margin: 10px 0;
        }

        .message {
            font-size: 1.2em;
            color: #165e3f;
            font-weight: 600;
            margin-top: 10px;
        }

        .randomize-btn {
            background: linear-gradient(135deg, #c41e3a 0%, #e63946 100%);
            color: white;
            border: none;
            padding: 18px 50px;
            font-size: 1.3em;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(196, 30, 58, 0.4);
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .randomize-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(196, 30, 58, 0.6);
            background: linear-gradient(135deg, #e63946 0%, #c41e3a 100%);
        }

        .randomize-btn:active {
            transform: translateY(0);
        }

        .randomize-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .emoji {
            font-size: 3em;
            margin-bottom: 10px;
            animation: bounce 1s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .confetti {
            position: fixed;
            width: 10px;
            height: 10px;
            z-index: 100;
            animation: confetti-fall 3s ease-out forwards;
        }

        @keyframes confetti-fall {
            to {
                transform: translateY(100vh) rotate(360deg);
                opacity: 0;
            }
        }

        /* Added sound toggle button styles */
        .sound-toggle {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(196, 30, 58, 0.2);
            border: 2px solid #c41e3a;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            cursor: pointer;
            font-size: 1.5em;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .sound-toggle:hover {
            background: rgba(196, 30, 58, 0.3);
            transform: scale(1.1);
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 2em;
            }
            .amount {
                font-size: 2.5em;
            }
            .prize-item {
                font-size: 0.85em;
                padding: 6px 12px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Added sound toggle button -->
        <button class="sound-toggle" id="soundToggle" onclick="toggleSound()" title="Toggle Sound">🔊</button>
        
        <h1>🎄 Pamasko ni nongni 🎁</h1>
        <p class="subtitle">Merry Christmas!</p>
        
        <div class="prize-list">
            <div class="prize-list-title">Possible Prizes:</div>
            <div class="prize-items">
                <span class="prize-item">Apir 👋</span>
                <span class="prize-item">₱10</span>
                <span class="prize-item">₱20</span>
                <span class="prize-item">₱50</span>
                <span class="prize-item">₱100</span>
                <span class="prize-item">₱200</span>
                <span class="prize-item">₱500</span>
                <span class="prize-item">₱1000</span>
            </div>
        </div>
        
        <div class="result-box" id="resultBox">
            <div class="emoji" id="emoji">🎅</div>
            <div class="amount" id="amount">₱ ???</div>
            <div class="message" id="message">Click the button to get your pamasko!</div>
        </div>

        <button class="randomize-btn" id="randomizeBtn" onclick="randomize()">
            🎲 Get My Pamasko!
        </button>
    </div>

    <script>
        const prizes = [
            { amount: "apir", message: "bawi next year", emoji: "👋" },
            { amount: 10, message: "ahahahahaha", emoji: "😊" },
            { amount: 20, message: "aangal ka pa", emoji: "😋" },
        ];

        let soundEnabled = true;
        const audioContext = new (window.AudioContext || window.webkitAudioContext)();

        function playClickSound() {
            if (!soundEnabled) return;
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();
            
            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);
            
            oscillator.frequency.value = 800;
            oscillator.type = 'sine';
            
            gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.1);
            
            oscillator.start(audioContext.currentTime);
            oscillator.stop(audioContext.currentTime + 0.1);
        }

        function playSpinSound() {
            if (!soundEnabled) return;
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();
            
            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);
            
            oscillator.frequency.setValueAtTime(200, audioContext.currentTime);
            oscillator.frequency.exponentialRampToValueAtTime(800, audioContext.currentTime + 0.8);
            oscillator.type = 'triangle';
            
            gainNode.gain.setValueAtTime(0.2, audioContext.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.8);
            
            oscillator.start(audioContext.currentTime);
            oscillator.stop(audioContext.currentTime + 0.8);
        }

        function playSadSound() {
            if (!soundEnabled) return;
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();
            
            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);
            
            oscillator.frequency.setValueAtTime(400, audioContext.currentTime);
            oscillator.frequency.exponentialRampToValueAtTime(200, audioContext.currentTime + 0.5);
            oscillator.type = 'sawtooth';
            
            gainNode.gain.setValueAtTime(0.2, audioContext.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.5);
            
            oscillator.start(audioContext.currentTime);
            oscillator.stop(audioContext.currentTime + 0.5);
        }

        function playWinSound() {
            if (!soundEnabled) return;
            // Small win sound
            const notes = [523.25, 587.33, 659.25]; // C, D, E
            notes.forEach((freq, index) => {
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();
                
                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);
                
                oscillator.frequency.value = freq;
                oscillator.type = 'sine';
                
                const startTime = audioContext.currentTime + (index * 0.1);
                gainNode.gain.setValueAtTime(0.2, startTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, startTime + 0.3);
                
                oscillator.start(startTime);
                oscillator.stop(startTime + 0.3);
            });
        }

        function playBigWinSound() {
            if (!soundEnabled) return;
            // Big win fanfare
            const notes = [523.25, 659.25, 783.99, 1046.50]; // C, E, G, C (high)
            notes.forEach((freq, index) => {
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();
                
                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);
                
                oscillator.frequency.value = freq;
                oscillator.type = 'sine';
                
                const startTime = audioContext.currentTime + (index * 0.15);
                gainNode.gain.setValueAtTime(0.25, startTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, startTime + 0.4);
                
                oscillator.start(startTime);
                oscillator.stop(startTime + 0.4);
            });
        }

        function toggleSound() {
            soundEnabled = !soundEnabled;
            const toggle = document.getElementById('soundToggle');
            toggle.textContent = soundEnabled ? '🔊' : '🔇';
            playClickSound(); // Play sound when toggling on
        }

        function createSnowflakes() {
            const snowflakeCount = 50;
            for (let i = 0; i < snowflakeCount; i++) {
                const snowflake = document.createElement('div');
                snowflake.className = 'snowflake';
                snowflake.innerHTML = '❄';
                snowflake.style.left = Math.random() * 100 + '%';
                snowflake.style.animationDuration = (Math.random() * 3 + 2) + 's';
                snowflake.style.animationDelay = Math.random() * 5 + 's';
                snowflake.style.fontSize = (Math.random() * 10 + 10) + 'px';
                document.body.appendChild(snowflake);
            }
        }

        function createConfetti() {
            const colors = ['#ff0000', '#00ff00', '#0000ff', '#ffff00', '#ff00ff', '#00ffff'];
            for (let i = 0; i < 50; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.left = Math.random() * 100 + '%';
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.animationDelay = (Math.random() * 0.5) + 's';
                document.body.appendChild(confetti);
                
                setTimeout(() => confetti.remove(), 3000);
            }
        }

        function randomize() {
            const btn = document.getElementById('randomizeBtn');
            const resultBox = document.getElementById('resultBox');
            const amountEl = document.getElementById('amount');
            const messageEl = document.getElementById('message');
            const emojiEl = document.getElementById('emoji');

            playClickSound();
            setTimeout(() => playSpinSound(), 100);

            btn.disabled = true;
            resultBox.classList.add('spinning');

            amountEl.textContent = '₱ ???';
            messageEl.textContent = 'Spinning...';
            emojiEl.textContent = '🎰';

            setTimeout(() => {
                const prize = prizes[Math.floor(Math.random() * prizes.length)];

                if (prize.amount === "apir") {
                    amountEl.textContent = 'APIR! 👋';
                    playSadSound();
                } else {
                    amountEl.textContent = '₱ ' + prize.amount.toLocaleString();
                    if (prize.amount >= 500) {
                        playBigWinSound();
                    } else if (prize.amount >= 50) {
                        playWinSound();
                    } else {
                        playClickSound();
                    }
                }
                messageEl.textContent = prize.message;
                emojiEl.textContent = prize.emoji;

                resultBox.classList.remove('spinning');

                if (prize.amount >= 500) {
                    createConfetti();
                }

                btn.disabled = false;
            }, 1000);
        }

        window.onload = function() {
            createSnowflakes();
        };
    </script>
</body>
</html>
